<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI加密货币自动交易系统</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            text-align: center;
        }

        .header h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }

        .status-running {
            background: #10b981;
            color: white;
        }

        .status-stopped {
            background: #ef4444;
            color: white;
        }

        .controls {
            margin-top: 20px;
        }

        .btn {
            padding: 12px 30px;
            margin: 0 10px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-start {
            background: #10b981;
            color: white;
        }

        .btn-start:hover {
            background: #059669;
        }

        .btn-stop {
            background: #ef4444;
            color: white;
        }

        .btn-stop:hover {
            background: #dc2626;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 15px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .stat-label {
            color: #666;
            font-weight: 500;
        }

        .stat-value {
            color: #333;
            font-weight: bold;
        }

        .positive {
            color: #10b981;
        }

        .negative {
            color: #ef4444;
        }

        .chart-container {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .trades-table {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #667eea;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: bold;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #f9fafb;
        }

        .trade-long {
            color: #10b981;
            font-weight: bold;
        }

        .trade-short {
            color: #ef4444;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI加密货币自动交易系统</h1>
            <div style="margin-top: 15px;">
                <span id="statusBadge" class="status-badge status-stopped">系统已停止</span>
            </div>
            <div class="controls">
                <button class="btn btn-start" onclick="startTrading()">启动自动交易</button>
                <button class="btn btn-stop" onclick="stopTrading()">停止自动交易</button>
            </div>
        </div>

        <div class="dashboard">
            <div class="card">
                <h2>💰 账户信息</h2>
                <div id="accountInfo">
                    <div class="loading">加载中...</div>
                </div>
            </div>

            <div class="card">
                <h2>📊 持仓信息</h2>
                <div id="positionInfo">
                    <div class="loading">加载中...</div>
                </div>
            </div>

            <div class="card">
                <h2>📈 当前价格</h2>
                <div id="priceInfo">
                    <div class="loading">加载中...</div>
                </div>
            </div>
        </div>

        <div class="chart-container">
            <h2>价格走势图</h2>
            <canvas id="priceChart"></canvas>
        </div>

        <div class="trades-table">
            <h2>交易历史</h2>
            <div id="tradesTable">
                <div class="loading">加载中...</div>
            </div>
        </div>
    </div>

    <script>
        let priceChart = null;
        let updateInterval = null;

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            updateStatus();
            updateAccount();
            updatePriceHistory();
            updateTrades();

            // 每60秒更新一次数据
            updateInterval = setInterval(() => {
                updateStatus();
                updateAccount();
                updatePriceHistory();
                updateTrades();
            }, 60000);
        });

        // 更新系统状态
        function updateStatus() {
            fetch('/api/status')
                .then(response => response.json())
                .then(data => {
                    const badge = document.getElementById('statusBadge');
                    if (data.is_running) {
                        badge.textContent = '系统运行中';
                        badge.className = 'status-badge status-running';
                    } else {
                        badge.textContent = '系统已停止';
                        badge.className = 'status-badge status-stopped';
                    }
                })
                .catch(error => console.error('Error:', error));
        }

        // 更新账户信息
        function updateAccount() {
            fetch('/api/account')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const account = data.account;
                        const pnl = account.total_equity - account.balance - account.total_margin;
                        const pnlClass = pnl >= 0 ? 'positive' : 'negative';

                        document.getElementById('accountInfo').innerHTML = `
                            <div class="stat-item">
                                <span class="stat-label">可用余额</span>
                                <span class="stat-value">$${account.balance.toFixed(2)}</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">占用保证金</span>
                                <span class="stat-value">$${account.total_margin.toFixed(2)}</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">未实现盈亏</span>
                                <span class="stat-value ${pnlClass}">${pnl >= 0 ? '+' : ''}$${pnl.toFixed(2)}</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">总权益</span>
                                <span class="stat-value">$${account.total_equity.toFixed(2)}</span>
                            </div>
                        `;

                        document.getElementById('priceInfo').innerHTML = `
                            <div class="stat-item">
                                <span class="stat-label">ETHUSDT</span>
                                <span class="stat-value">$${data.current_price.toFixed(2)}</span>
                            </div>
                        `;

                        updatePositionInfo(account);
                    }
                })
                .catch(error => console.error('Error:', error));
        }

        // 更新持仓信息
        function updatePositionInfo(account) {
            let html = '';

            if (account.long_position) {
                const pos = account.long_position;
                html += `
                    <div class="stat-item">
                        <span class="stat-label">多头持仓</span>
                        <span class="stat-value trade-long">${pos.total_quantity.toFixed(4)}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">平均成本</span>
                        <span class="stat-value">$${pos.avg_price.toFixed(2)}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">平均杠杆</span>
                        <span class="stat-value">${pos.avg_leverage.toFixed(2)}x</span>
                    </div>
                `;
            }

            if (account.short_position) {
                const pos = account.short_position;
                html += `
                    <div class="stat-item">
                        <span class="stat-label">空头持仓</span>
                        <span class="stat-value trade-short">${pos.total_quantity.toFixed(4)}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">平均成本</span>
                        <span class="stat-value">$${pos.avg_price.toFixed(2)}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">平均杠杆</span>
                        <span class="stat-value">${pos.avg_leverage.toFixed(2)}x</span>
                    </div>
                `;
            }

            if (!account.long_position && !account.short_position) {
                html = '<div class="loading">暂无持仓</div>';
            }

            document.getElementById('positionInfo').innerHTML = html;
        }

        // 更新价格历史图表
        function updatePriceHistory() {
            fetch('/api/price_history')
                .then(response => response.json())
                .then(data => {
                    if (data.success && data.prices.length > 0) {
                        const labels = data.prices.map(p => {
                            const date = new Date(p.timestamp);
                            return date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
                        });
                        const prices = data.prices.map(p => p.price);

                        if (priceChart) {
                            priceChart.data.labels = labels;
                            priceChart.data.datasets[0].data = prices;
                            priceChart.update();
                        } else {
                            const ctx = document.getElementById('priceChart').getContext('2d');
                            priceChart = new Chart(ctx, {
                                type: 'line',
                                data: {
                                    labels: labels,
                                    datasets: [{
                                        label: 'ETHUSDT 价格',
                                        data: prices,
                                        borderColor: '#667eea',
                                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                                        borderWidth: 2,
                                        tension: 0.4,
                                        fill: true
                                    }]
                                },
                                options: {
                                    responsive: true,
                                    maintainAspectRatio: true,
                                    plugins: {
                                        legend: {
                                            display: true,
                                            position: 'top'
                                        }
                                    },
                                    scales: {
                                        y: {
                                            beginAtZero: false,
                                            ticks: {
                                                callback: function(value) {
                                                    return '$' + value.toFixed(2);
                                                }
                                            }
                                        }
                                    }
                                }
                            });
                        }
                    }
                })
                .catch(error => console.error('Error:', error));
        }

        // 更新交易历史表格
        function updateTrades() {
            fetch('/api/history')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const trades = data.trades;
                        if (trades.length === 0) {
                            document.getElementById('tradesTable').innerHTML = '<div class="loading">暂无交易记录</div>';
                            return;
                        }

                        let html = '<table><thead><tr>';
                        html += '<th>交易ID</th>';
                        html += '<th>时间</th>';
                        html += '<th>类型</th>';
                        html += '<th>数量</th>';
                        html += '<th>价格</th>';
                        html += '<th>杠杆</th>';
                        html += '<th>保证金</th>';
                        html += '<th>操作</th>';
                        html += '</tr></thead><tbody>';

                        // 倒序显示，最新的在前面
                        for (let i = trades.length - 1; i >= 0; i--) {
                            const trade = trades[i];
                            const date = new Date(trade.timestamp);
                            const timeStr = date.toLocaleString('zh-CN');
                            const typeClass = trade.position_type === 'LONG' ? 'trade-long' : 'trade-short';
                            const typeText = trade.position_type === 'LONG' ? '做多' : '做空';
                            const actionText = trade.is_open ? '开仓' : '平仓';

                            html += '<tr>';
                            html += `<td>${trade.trade_id}</td>`;
                            html += `<td>${timeStr}</td>`;
                            html += `<td class="${typeClass}">${typeText}</td>`;
                            html += `<td>${trade.quantity.toFixed(4)}</td>`;
                            html += `<td>$${trade.price.toFixed(2)}</td>`;
                            html += `<td>${trade.leverage}x</td>`;
                            html += `<td>$${trade.cost.toFixed(2)}</td>`;
                            html += `<td>${actionText}</td>`;
                            html += '</tr>';
                        }

                        html += '</tbody></table>';
                        document.getElementById('tradesTable').innerHTML = html;
                    }
                })
                .catch(error => console.error('Error:', error));
        }

        // 启动自动交易
        function startTrading() {
            fetch('/api/start')
                .then(response => response.json())
                .then(data => {
                    alert(data.message);
                    updateStatus();
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('启动失败');
                });
        }

        // 停止自动交易
        function stopTrading() {
            fetch('/api/stop')
                .then(response => response.json())
                .then(data => {
                    alert(data.message);
                    updateStatus();
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('停止失败');
                });
        }
    </script>
</body>
</html>
