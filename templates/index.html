<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI加密货币自动交易系统</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            text-align: center;
        }

        .header h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }

        .status-running {
            background: #10b981;
            color: white;
        }

        .status-stopped {
            background: #ef4444;
            color: white;
        }

        .controls {
            margin-top: 20px;
        }

        .btn {
            padding: 12px 30px;
            margin: 0 10px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-start {
            background: #10b981;
            color: white;
        }

        .btn-start:hover {
            background: #059669;
        }

        .btn-stop {
            background: #ef4444;
            color: white;
        }

        .btn-stop:hover {
            background: #dc2626;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 15px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .stat-label {
            color: #666;
            font-weight: 500;
        }

        .stat-value {
            color: #333;
            font-weight: bold;
        }

        .positive {
            color: #10b981;
        }

        .negative {
            color: #ef4444;
        }

        .chart-container {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .trades-table {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #667eea;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: bold;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #f9fafb;
        }

        .trade-long {
            color: #10b981;
            font-weight: bold;
        }

        .trade-short {
            color: #ef4444;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .ai-responses {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-top: 20px;
        }

        .ai-section {
            margin-bottom: 25px;
            padding: 20px;
            background: #f9fafb;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .ai-section h3 {
            color: #667eea;
            font-size: 18px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ai-content {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            white-space: pre-wrap;
            word-wrap: break-word;
            line-height: 1.6;
            color: #333;
        }

        .ai-meta {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }

        .ai-meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .ai-meta-label {
            font-weight: bold;
        }

        .timestamp {
            color: #999;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI加密货币自动交易系统</h1>
            <div style="margin-top: 15px;">
                <span id="statusBadge" class="status-badge status-stopped">系统已停止</span>
            </div>
            <div class="controls">
                <button class="btn btn-start" onclick="startTrading()">启动自动交易</button>
                <button class="btn btn-stop" onclick="stopTrading()">停止自动交易</button>
            </div>
        </div>

        <div class="dashboard">
            <div class="card">
                <h2>💰 正向账户信息</h2>
                <div id="accountInfoNormal">
                    <div class="loading">加载中...</div>
                </div>
            </div>

            <div class="card">
                <h2>💰 反向账户信息</h2>
                <div id="accountInfoReverse">
                    <div class="loading">加载中...</div>
                </div>
            </div>

            <div class="card">
                <h2>📈 当前价格</h2>
                <div id="priceInfo">
                    <div class="loading">加载中...</div>
                </div>
            </div>
        </div>

        <div class="dashboard">
            <div class="card">
                <h2>📊 正向持仓信息</h2>
                <div id="positionInfoNormal">
                    <div class="loading">加载中...</div>
                </div>
            </div>

            <div class="card">
                <h2>📊 反向持仓信息</h2>
                <div id="positionInfoReverse">
                    <div class="loading">加载中...</div>
                </div>
            </div>
        </div>

        <div class="chart-container">
            <h2>价格走势图</h2>
            <canvas id="priceChart"></canvas>
        </div>

        <div class="trades-table">
            <h2>正向交易历史</h2>
            <div id="tradesTableNormal">
                <div class="loading">加载中...</div>
            </div>
        </div>

        <div class="trades-table">
            <h2>反向交易历史</h2>
            <div id="tradesTableReverse">
                <div class="loading">加载中...</div>
            </div>
        </div>

        <div class="ai-responses">
            <h2>🤖 最新AI分析结果</h2>
            <div id="aiResponsesContent">
                <div class="loading">暂无数据</div>
            </div>
        </div>
    </div>

    <script>
        let priceChart = null;
        let updateInterval = null;

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            updateStatus();
            updateAccount();
            updatePriceHistory();
            updateTrades();
            updateAIResponses();

            // 每60秒更新一次数据
            updateInterval = setInterval(() => {
                updateStatus();
                updateAccount();
                updatePriceHistory();
                updateTrades();
                updateAIResponses();
            }, 60000);
        });

        // 更新系统状态
        function updateStatus() {
            fetch('/api/status')
                .then(response => response.json())
                .then(data => {
                    const badge = document.getElementById('statusBadge');
                    if (data.is_running) {
                        badge.textContent = '系统运行中';
                        badge.className = 'status-badge status-running';
                    } else {
                        badge.textContent = '系统已停止';
                        badge.className = 'status-badge status-stopped';
                    }
                })
                .catch(error => console.error('Error:', error));
        }

        // 更新账户信息
        function updateAccount() {
            fetch('/api/account')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const accountNormal = data.account_normal;
                        const accountReverse = data.account_reverse;
                        const pnlNormal = accountNormal.total_equity - accountNormal.balance - accountNormal.total_margin;
                        const pnlReverse = accountReverse.total_equity - accountReverse.balance - accountReverse.total_margin;
                        const pnlClassNormal = pnlNormal >= 0 ? 'positive' : 'negative';
                        const pnlClassReverse = pnlReverse >= 0 ? 'positive' : 'negative';

                        // 正向账户信息
                        document.getElementById('accountInfoNormal').innerHTML = `
                            <div class="stat-item">
                                <span class="stat-label">可用余额</span>
                                <span class="stat-value">$${accountNormal.balance.toFixed(2)}</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">占用保证金</span>
                                <span class="stat-value">$${accountNormal.total_margin.toFixed(2)}</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">未实现盈亏</span>
                                <span class="stat-value ${pnlClassNormal}">${pnlNormal >= 0 ? '+' : ''}$${pnlNormal.toFixed(2)}</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">总权益</span>
                                <span class="stat-value">$${accountNormal.total_equity.toFixed(2)}</span>
                            </div>
                        `;

                        // 反向账户信息
                        document.getElementById('accountInfoReverse').innerHTML = `
                            <div class="stat-item">
                                <span class="stat-label">可用余额</span>
                                <span class="stat-value">$${accountReverse.balance.toFixed(2)}</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">占用保证金</span>
                                <span class="stat-value">$${accountReverse.total_margin.toFixed(2)}</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">未实现盈亏</span>
                                <span class="stat-value ${pnlClassReverse}">${pnlReverse >= 0 ? '+' : ''}$${pnlReverse.toFixed(2)}</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">总权益</span>
                                <span class="stat-value">$${accountReverse.total_equity.toFixed(2)}</span>
                            </div>
                        `;

                        document.getElementById('priceInfo').innerHTML = `
                            <div class="stat-item">
                                <span class="stat-label">ETHUSDT</span>
                                <span class="stat-value">$${data.current_price.toFixed(2)}</span>
                            </div>
                        `;

                        updatePositionInfo(accountNormal, accountReverse);
                    }
                })
                .catch(error => console.error('Error:', error));
        }

        // 更新持仓信息
        function updatePositionInfo(accountNormal, accountReverse) {
            // 正向持仓
            let htmlNormal = '';
            if (accountNormal.long_position) {
                const pos = accountNormal.long_position;
                htmlNormal += `
                    <div class="stat-item">
                        <span class="stat-label">多头持仓</span>
                        <span class="stat-value trade-long">${pos.total_quantity.toFixed(4)}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">平均成本</span>
                        <span class="stat-value">$${pos.avg_price.toFixed(2)}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">平均杠杆</span>
                        <span class="stat-value">${pos.avg_leverage.toFixed(2)}x</span>
                    </div>
                `;
            }

            if (accountNormal.short_position) {
                const pos = accountNormal.short_position;
                htmlNormal += `
                    <div class="stat-item">
                        <span class="stat-label">空头持仓</span>
                        <span class="stat-value trade-short">${pos.total_quantity.toFixed(4)}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">平均成本</span>
                        <span class="stat-value">$${pos.avg_price.toFixed(2)}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">平均杠杆</span>
                        <span class="stat-value">${pos.avg_leverage.toFixed(2)}x</span>
                    </div>
                `;
            }

            if (!accountNormal.long_position && !accountNormal.short_position) {
                htmlNormal = '<div class="loading">暂无持仓</div>';
            }

            document.getElementById('positionInfoNormal').innerHTML = htmlNormal;

            // 反向持仓
            let htmlReverse = '';
            if (accountReverse.long_position) {
                const pos = accountReverse.long_position;
                htmlReverse += `
                    <div class="stat-item">
                        <span class="stat-label">多头持仓</span>
                        <span class="stat-value trade-long">${pos.total_quantity.toFixed(4)}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">平均成本</span>
                        <span class="stat-value">$${pos.avg_price.toFixed(2)}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">平均杠杆</span>
                        <span class="stat-value">${pos.avg_leverage.toFixed(2)}x</span>
                    </div>
                `;
            }

            if (accountReverse.short_position) {
                const pos = accountReverse.short_position;
                htmlReverse += `
                    <div class="stat-item">
                        <span class="stat-label">空头持仓</span>
                        <span class="stat-value trade-short">${pos.total_quantity.toFixed(4)}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">平均成本</span>
                        <span class="stat-value">$${pos.avg_price.toFixed(2)}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">平均杠杆</span>
                        <span class="stat-value">${pos.avg_leverage.toFixed(2)}x</span>
                    </div>
                `;
            }

            if (!accountReverse.long_position && !accountReverse.short_position) {
                htmlReverse = '<div class="loading">暂无持仓</div>';
            }

            document.getElementById('positionInfoReverse').innerHTML = htmlReverse;
        }

        // 更新价格历史图表
        function updatePriceHistory() {
            Promise.all([
                fetch('/api/price_history').then(r => r.json()),
                fetch('/api/equity_history').then(r => r.json())
            ]).then(([priceData, equityData]) => {
                if (priceData.success && priceData.prices.length > 0) {
                    const labels = priceData.prices.map(p => {
                        const date = new Date(p.timestamp);
                        return date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
                    });
                    const prices = priceData.prices.map(p => p.price);
                    const equitiesNormal = equityData.success && equityData.equities_normal.length > 0
                        ? equityData.equities_normal.map(e => e.equity)
                        : [];
                    const equitiesReverse = equityData.success && equityData.equities_reverse.length > 0
                        ? equityData.equities_reverse.map(e => e.equity)
                        : [];

                    if (priceChart) {
                        priceChart.data.labels = labels;
                        priceChart.data.datasets[0].data = prices;
                        if (equitiesNormal.length > 0) {
                            priceChart.data.datasets[1].data = equitiesNormal;
                        }
                        if (equitiesReverse.length > 0) {
                            priceChart.data.datasets[2].data = equitiesReverse;
                        }
                        priceChart.update();
                    } else {
                        const ctx = document.getElementById('priceChart').getContext('2d');
                        const datasets = [{
                            label: 'ETHUSDT 价格',
                            data: prices,
                            borderColor: '#667eea',
                            backgroundColor: 'rgba(102, 126, 234, 0.1)',
                            borderWidth: 2,
                            tension: 0.4,
                            fill: true,
                            yAxisID: 'y'
                        }];

                        if (equitiesNormal.length > 0) {
                            datasets.push({
                                label: '正向总权益',
                                data: equitiesNormal,
                                borderColor: '#10b981',
                                backgroundColor: 'rgba(16, 185, 129, 0.1)',
                                borderWidth: 2,
                                tension: 0.4,
                                fill: true,
                                yAxisID: 'y1'
                            });
                        }

                        if (equitiesReverse.length > 0) {
                            datasets.push({
                                label: '反向总权益',
                                data: equitiesReverse,
                                borderColor: '#ef4444',
                                backgroundColor: 'rgba(239, 68, 68, 0.1)',
                                borderWidth: 2,
                                tension: 0.4,
                                fill: true,
                                yAxisID: 'y1'
                            });
                        }

                        priceChart = new Chart(ctx, {
                            type: 'line',
                            data: {
                                labels: labels,
                                datasets: datasets
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: true,
                                plugins: {
                                    legend: {
                                        display: true,
                                        position: 'top'
                                    }
                                },
                                scales: {
                                    y: {
                                        type: 'linear',
                                        display: true,
                                        position: 'left',
                                        beginAtZero: false,
                                        title: {
                                            display: true,
                                            text: 'ETH价格 ($)'
                                        },
                                        ticks: {
                                            callback: function(value) {
                                                return '$' + value.toFixed(2);
                                            }
                                        }
                                    },
                                    y1: {
                                        type: 'linear',
                                        display: true,
                                        position: 'right',
                                        beginAtZero: false,
                                        title: {
                                            display: true,
                                            text: '总权益 ($)'
                                        },
                                        ticks: {
                                            callback: function(value) {
                                                return '$' + value.toFixed(2);
                                            }
                                        },
                                        grid: {
                                            drawOnChartArea: false
                                        }
                                    }
                                }
                            }
                            });
                        }
                    }
                })
                .catch(error => console.error('Error:', error));
        }

        // 更新交易历史表格
        function updateTrades() {
            fetch('/api/history')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        // 正向交易历史
                        const tradesNormal = data.trades_normal;
                        if (tradesNormal.length === 0) {
                            document.getElementById('tradesTableNormal').innerHTML = '<div class="loading">暂无交易记录</div>';
                        } else {
                            document.getElementById('tradesTableNormal').innerHTML = generateTradesTable(tradesNormal);
                        }

                        // 反向交易历史
                        const tradesReverse = data.trades_reverse;
                        if (tradesReverse.length === 0) {
                            document.getElementById('tradesTableReverse').innerHTML = '<div class="loading">暂无交易记录</div>';
                        } else {
                            document.getElementById('tradesTableReverse').innerHTML = generateTradesTable(tradesReverse);
                        }
                    }
                })
                .catch(error => console.error('Error:', error));
        }

        // 生成交易表格HTML
        function generateTradesTable(trades) {
            let html = '<table><thead><tr>';
            html += '<th>交易ID</th>';
            html += '<th>时间</th>';
            html += '<th>类型</th>';
            html += '<th>数量</th>';
            html += '<th>价格</th>';
            html += '<th>杠杆</th>';
            html += '<th>保证金</th>';
            html += '<th>操作</th>';
            html += '</tr></thead><tbody>';

            // 倒序显示，最新的在前面
            for (let i = trades.length - 1; i >= 0; i--) {
                const trade = trades[i];
                const date = new Date(trade.timestamp);
                const timeStr = date.toLocaleString('zh-CN');
                const typeClass = trade.position_type === 'LONG' ? 'trade-long' : 'trade-short';
                const typeText = trade.position_type === 'LONG' ? '做多' : '做空';
                const actionText = trade.is_open ? '开仓' : '平仓';

                html += '<tr>';
                html += `<td>${trade.trade_id}</td>`;
                html += `<td>${timeStr}</td>`;
                html += `<td class="${typeClass}">${typeText}</td>`;
                html += `<td>${trade.quantity.toFixed(4)}</td>`;
                html += `<td>$${trade.price.toFixed(2)}</td>`;
                html += `<td>${trade.leverage}x</td>`;
                html += `<td>$${trade.cost.toFixed(2)}</td>`;
                html += `<td>${actionText}</td>`;
                html += '</tr>';
            }

            html += '</tbody></table>';
            return html;
        }

        // 启动自动交易
        function startTrading() {
            fetch('/api/start')
                .then(response => response.json())
                .then(data => {
                    alert(data.message);
                    updateStatus();
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('启动失败');
                });
        }

        // 停止自动交易
        function stopTrading() {
            fetch('/api/stop')
                .then(response => response.json())
                .then(data => {
                    alert(data.message);
                    updateStatus();
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('停止失败');
                });
        }
    </script>
</body>
</html>
